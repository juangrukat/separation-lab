name: SeparationLab
options:
  bundleIdPrefix: local.separationlab
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: '1'
targets:
  SeparationLab:
    type: application
    platform: iOS
    sources: [SeparationLab]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.separationlab.measure
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Separation Lab
        INFOPLIST_KEY_NSCameraUsageDescription: Capture material edges and a nearby scale reference to investigate separation measurements.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: '0.1'
        CURRENT_PROJECT_VERSION: '4'
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets: []
